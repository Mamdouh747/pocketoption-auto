name: Validate PO Auto Signals

on:
  push:
    branches:
      - main
      - feature/pro-signals-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate app
        run: node tests/validate-app.js
